services:
  check:
    image: nixos/nix:2.34.7
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      - NIX_CONFIG=experimental-features = nix-command flakes
    command: sh -c '
      git config --global safe.directory /workspace 2>/dev/null;
      [ -f secrets.nix ] && git add -f secrets.nix;
      nix flake check "$@";
      rc=$?;
      git reset -- secrets.nix 2>/dev/null || true;
      exit $rc
    ' --

  build:
    image: nixos/nix:2.34.7
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      - NIX_CONFIG=experimental-features = nix-command flakes
    command: sh -c '
      git config --global safe.directory /workspace 2>/dev/null;
      [ -f secrets.nix ] && git add -f secrets.nix;
      nix build .#image-gnome "$@";
      rc=$?;
      git reset -- secrets.nix 2>/dev/null || true;
      exit $rc
    ' --

  dev:
    image: nixos/nix:2.34.7
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      - NIX_CONFIG=experimental-features = nix-command flakes
    stdin_open: true
    tty: true

volumes:
  nix-store:
