services:
  check:
    image: nixos/nix:2.34.7
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      - NIX_CONFIG=experimental-features = nix-command flakes
    command: sh -c 'git config --global safe.directory /workspace 2>/dev/null; exec nix flake check "$@"' --

  build:
    image: nixos/nix:2.34.7
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      - NIX_CONFIG=experimental-features = nix-command flakes
    command: sh -c 'git config --global safe.directory /workspace 2>/dev/null; exec nix build .#image-gnome "$@"' --

  dev:
    image: nixos/nix:2.34.7
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      - NIX_CONFIG=experimental-features = nix-command flakes
    stdin_open: true
    tty: true

volumes:
  nix-store:
