services:
  check:
    image: nixos/nix:${NIX_IMAGE_VERSION}
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-trusted-substituters = https://cache.nixos.org
        extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    entrypoint: ./scripts/check.sh

  build:
    image: nixos/nix:${NIX_IMAGE_VERSION}
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-trusted-substituters = https://cache.nixos.org
        extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    entrypoint: ./scripts/build.sh
    command: .#image-gnome

  fmt:
    image: nixos/nix:${NIX_IMAGE_VERSION}
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-trusted-substituters = https://cache.nixos.org
        extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    command: sh -c 'git config --global safe.directory /workspace 2>/dev/null; exec nix fmt "$@"' --

  dev:
    image: nixos/nix:${NIX_IMAGE_VERSION}
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-trusted-substituters = https://cache.nixos.org
        extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    stdin_open: true
    tty: true

volumes:
  nix-store:
