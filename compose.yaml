services:
  check:
    image: nixos/nix:${NIX_IMAGE_VERSION}
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      - NIX_CONFIG=${NIX_CONFIG:-experimental-features = nix-command flakes}
    command: sh -c './scripts/check.sh "$@"' --

  build:
    image: nixos/nix:${NIX_IMAGE_VERSION}
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      - NIX_CONFIG=${NIX_CONFIG:-experimental-features = nix-command flakes}
    command: sh -c './scripts/build.sh "$@"' --

  fmt:
    image: nixos/nix:${NIX_IMAGE_VERSION}
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      - NIX_CONFIG=${NIX_CONFIG:-experimental-features = nix-command flakes}
    command: sh -c 'git config --global safe.directory /workspace 2>/dev/null; exec nix fmt "$@"' --

  dev:
    image: nixos/nix:${NIX_IMAGE_VERSION}
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nix-store:/nix
    environment:
      - NIX_CONFIG=${NIX_CONFIG:-experimental-features = nix-command flakes}
    stdin_open: true
    tty: true

volumes:
  nix-store:
